<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC SNA SPARSH Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      .page-break { page-break-after: always; break-after: page; }
      body { background: white !important; font-size: 11pt; color: black; }
      .sheet { box-shadow: none !important; border: 1px solid #000 !important; margin: 0 0 20px 0 !important; padding: 20px !important; }
    }
    .editable:hover {
      outline: 2px dashed #3b82f6;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">

  <!-- TOP BAR -->
  <header class="no-print bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50 flex flex-wrap justify-between items-center gap-3">
    <div>
      <h1 class="text-xl font-bold tracking-tight">SMC SNA SPARSH — Grant Documentation System</h1>
      <p class="text-xs text-slate-300">CSV Auto-Fill, Editable Forms & Print Suite</p>
    </div>
    <div class="flex gap-2">
      <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded shadow transition">
        🖨️ Print / Save PDF
      </button>
      <button onclick="alert('Data saved in current session!')" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded shadow transition">
        💾 Save
      </button>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <nav class="no-print max-w-7xl mx-auto mt-4 px-4">
    <div class="flex flex-wrap gap-2 border-b border-gray-300 pb-2">
      <button onclick="switchTab('form')" id="btn-form" class="tab-btn bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium">1. Input Form / CSV Upload</button>
      <button onclick="switchTab('proceedings')" id="btn-proceedings" class="tab-btn bg-white hover:bg-gray-200 px-4 py-2 rounded text-sm font-medium">2. Proceedings</button>
      <button onclick="switchTab('resolution')" id="btn-resolution" class="tab-btn bg-white hover:bg-gray-200 px-4 py-2 rounded text-sm font-medium">3. Resolution</button>
      <button onclick="switchTab('budget')" id="btn-budget" class="tab-btn bg-white hover:bg-gray-200 px-4 py-2 rounded text-sm font-medium">4. Budget Register</button>
      <button onclick="switchTab('single-uc')" id="btn-single-uc" class="tab-btn bg-white hover:bg-gray-200 px-4 py-2 rounded text-sm font-medium">5. Single UC</button>
      <button onclick="switchTab('consolidated-uc')" id="btn-consolidated-uc" class="tab-btn bg-white hover:bg-gray-200 px-4 py-2 rounded text-sm font-medium">6. Consolidated UC</button>
      <button onclick="switchTab('receipts')" id="btn-receipts" class="tab-btn bg-white hover:bg-gray-200 px-4 py-2 rounded text-sm font-medium">7. Receipts</button>
      <button onclick="switchTab('voucher')" id="btn-voucher" class="tab-btn bg-white hover:bg-gray-200 px-4 py-2 rounded text-sm font-medium">8. Voucher Slip</button>
      <button onclick="switchTab('all')" id="btn-all" class="tab-btn bg-indigo-700 text-white px-4 py-2 rounded text-sm font-medium">📑 View All (Print Ready)</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-4">

    <!-- TAB 1: FORM & CSV UPLOAD -->
    <section id="tab-form" class="tab-content bg-white p-6 rounded shadow border">
      
      <!-- CSV UPLOAD BOX -->
      <div class="mb-6 p-4 bg-blue-50 border-2 border-dashed border-blue-400 rounded-lg flex flex-col sm:flex-row items-center justify-between gap-4">
        <div>
          <h3 class="font-bold text-blue-900 text-sm">📂 Upload SMC Grants CSV File:</h3>
          <p class="text-xs text-blue-700 mt-1">మీ దగ్గర ఉన్న CSV ఫైల్‌ను సెలెక్ట్ చేయగానే వివరాలన్నీ క్రింది ఫారమ్‌లో మరియు అన్ని బిల్లుల్లో ఆటోమేటిక్‌గా నిండుతాయి.</p>
        </div>
        <div class="flex items-center gap-2">
          <input type="file" id="csvFileInput" accept=".csv" class="text-xs text-gray-700 file:mr-2 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer" onchange="handleCSVUpload(event)">
        </div>
      </div>

      <h2 class="text-base font-bold text-gray-800 border-b pb-2 mb-4">🏫 School & Grant Details</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs font-medium">
        <div>
          <label class="block mb-1">School Name</label>
          <input type="text" id="inSchool" value="ZPHS AKKANNAPET" class="w-full border p-2 rounded" oninput="renderAll()">
        </div>
        <div>
          <label class="block mb-1">UDISE Code</label>
          <input type="text" id="inUdise" value="36180700907" class="w-full border p-
